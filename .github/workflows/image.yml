# Build the whole Project 5 container once - Blender, its server, the desktop, SSH, the
# harness packages - and publish it to GitHub's registry. Student codespaces start
# from the published image, so none of it runs at create time (measured 2026-09-14: building
# the recipe at create took 11 min; with only Blender pre-built, 9; the features and the
# setup script were the rest).
name: container image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/Dockerfile"
      - ".github/build/devcontainer.json"
      - ".github/workflows/image.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build the dev container with its features and push it
        uses: devcontainers/ci@v0.3
        with:
          configFile: .github/build/devcontainer.json
          imageName: ghcr.io/${{ github.repository_owner }}/cse490-p05-blender
          imageTag: latest
          push: always
          runCmd: blender --version && uvx --version && python3 -c "import mcp, openai; print('packages ok')"
